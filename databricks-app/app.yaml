# Databricks Apps runtime config.
#
# The previous version of this file used an invented schema (app_name,
# resources, resource_type: wsgi). The real contract is a `command` to run and
# an `env` list; Databricks Apps injects DATABRICKS_APP_PORT and expects the
# process to bind it on 0.0.0.0.
#
# MICROGUARD_API_TOKEN has no value here on purpose. Store it as an app secret
# in the workspace and reference it; a shared secret in a committed file is not
# a shared secret. app.py refuses to start without it.

command:
  - uvicorn
  - app:app
  - --host
  - "0.0.0.0"
  - --port
  - "$DATABRICKS_APP_PORT"

env:
  - name: MICROGUARD_MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MICROGUARD_MLFLOW_EXPERIMENT
    value: "microguard-training"
  - name: MICROGUARD_API_TOKEN
    valueFrom: "microguard-api-token"
