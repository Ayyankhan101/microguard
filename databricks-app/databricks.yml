# Databricks Asset Bundle for the Microguard dashboard.
#
# The previous version of this file used top-level `app:`, `compute:` and
# `permissions:` keys, which are not bundle schema -- `databricks bundle
# validate` rejects them. A bundle is `bundle:` + `targets:` + `resources:`.
#
# Requires Databricks CLI 0.2xx+. The legacy 0.18 Python CLI has no `bundle`
# and no `apps` subcommand.
#
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run microguard_dashboard -t dev

bundle:
  name: microguard

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-0ca55f75-d20c.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-0ca55f75-d20c.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

resources:
  apps:
    microguard_dashboard:
      name: microguard-dashboard
      description: Microguard bot traffic detection dashboard
      source_code_path: ./
