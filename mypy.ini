[mypy]

[mypy-micrograd.*]
ignore_missing_imports = True

# mlflow ships only with the [mlflow] extra, so a base install has no stubs
# for it and `mypy microguard` would fail on a machine that never intends to
# talk to Databricks. tracking.py imports it lazily for exactly that reason.
[mypy-mlflow.*]
ignore_missing_imports = True

[mypy-microguard.vulture_whitelist]
ignore_errors = True
